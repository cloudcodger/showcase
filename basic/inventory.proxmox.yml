---
# See: https://docs.ansible.com/ansible/latest/collections/community/proxmox/proxmox_inventory.html
plugin: community.proxmox.proxmox
user: devops@pve
token_id: inventory
token_secret: "{{ lookup('file', '~/.pve_tokens/basic-devops-pve-inventory.token') }}"
url: https://gismo:8006/
validate_certs: false

#### Additional facts settings
want_facts: true
keyed_groups:
    # proxmox_tags_parsed is an example of a fact only returned when 'want_facts=true'
  - key: proxmox_tags_parsed
    separator: ""
compose:
  ansible_host: proxmox_ipconfig0.ip |
    default((proxmox_lxc_interfaces | selectattr('name', 'equalto', 'eth0') | map(attribute='inet') | first)
    if proxmox_lxc_interfaces is defined) |
    default(proxmox_net0.ip)|
    ansible.utils.ipaddr('address')
