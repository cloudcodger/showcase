---
# See the Builder-Playbook Wiki page.

- name: Skip creation of any existing builder CT (bug in community.proxmox.proxmox).
  gather_facts: false
  hosts: local_builder
  strategy: linear

  tasks:
    - name: Remove existing CTs from 'lxc_cts'.
      ansible.builtin.set_fact:
        lxc_cts: "{{ lxc_cts | rejectattr('name', 'in', groups['proxmox_all_lxc']) }}"

- name: Create builder CT.
  gather_facts: false
  hosts: local_builder

  roles:
    - name: cloudcodger.proxmox_client.lxc
    - name: cloudcodger.proxmox_client.add_guest_host

- name: Update cloud init image files.
  hosts: builder

  roles:
    - name: cloudcodger.assorted_apt.initial_apt_update

  tasks:
    - name: Install libguestfs-tools package.
      ansible.builtin.apt:
        name: libguestfs-tools
        cache_valid_time: 3600
        state: present

    - name: Download cloud-init image file.
      ansible.builtin.get_url:
        url: "{{ item.src }}"
        dest: "/root/{{ item.dest | basename }}.uncompressed"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.dest | basename }}"
      when: item.src.startswith('http')

    - name: Copy cloud-init image file.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/root/{{ item.dest | basename }}.uncompressed"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.src | basename }}"
      when: not item.src.startswith('http')

    - name: Resize the images to be large enough to add packages.
      ansible.builtin.command: "qemu-img resize /root/{{ item.dest | basename }}.uncompressed +2G"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.dest | basename }}"

    - name: Expand the images filesystem to be large enough to add packages.
      ansible.builtin.command: "virt-customize -a /root/{{ item.dest | basename }}.uncompressed --run-command 'growpart /dev/sda 1; resize2fs /dev/sda1'"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.dest | basename }}"

    - name: Add 'acl' and 'qemu-guest-agent' to image file and update it.
      ansible.builtin.command: "virt-customize -a {{ item.dest | basename }}.uncompressed --install acl,qemu-guest-agent --update"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.dest | basename }}"

    - name: Sysprep the image file.
      ansible.builtin.command: "virt-sysprep -a {{ item.dest | basename }}.uncompressed --operation defaults,-customize"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.dest | basename }}"

    - name: Compress image file.
      ansible.builtin.command: "virt-sparsify --compress {{ item.dest | basename }}.uncompressed {{ item.dest | basename }}"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.dest | basename }}"

    - name: Download the new image file.
      ansible.builtin.fetch:
        src: "/root/{{ item.dest | basename }}"
        dest: "{{ item.dest }}"
        flat: true
      loop: "{{ images }}"
