---
- name: Create an Umbrella VM for testing generic Ubuntu services.
  gather_facts: false
  hosts: local_umbrella

  roles:
    - name: cloudcodger.proxmox_client.cloud_init

- name: Perform the initial 'reboot' after creation, if required and never done.
  become: true
  hosts: umbrella

  roles:
    - name: cloudcodger.assorted_apt.cloud_init_reboot
